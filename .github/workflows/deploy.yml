name: Deploy

# Deploys the CloudPrnt stack. Runs only when started by hand from main.
# Repository variables: AWS_ROLE_ARN (a role this repository can assume
# through GitHub OIDC) and AWS_REGION.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cdk
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the Lambda packages
        working-directory: lambda
        run: ./gradlew --no-daemon check lambdaZip

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: cdk/.nvmrc
          cache: npm
          cache-dependency-path: cdk/package-lock.json

      - name: Install, type-check and test
        run: |
          npm ci
          npm run build
          npm test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: cloudprnt-deploy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Diff
        run: npx cdk diff CloudPrnt

      - name: Deploy
        run: npx cdk deploy CloudPrnt --require-approval never
