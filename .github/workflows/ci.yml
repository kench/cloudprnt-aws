name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional-commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check PR title and commit subjects
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          printf '%s\n' "$PR_TITLE" | sh .github/scripts/check-conventional-commit.sh
          git log --no-merges --format=%s "$BASE_SHA..$HEAD_SHA" \
            | sh .github/scripts/check-conventional-commit.sh

  java:
    name: Java
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lambda
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Spotless, Checkstyle, tests, 90% line coverage, the Lambda packages
      # and their SPDX SBOMs.
      - name: Check and package
        run: ./gradlew --no-daemon check lambdaZip spdxSbom

      - name: Upload Lambda packages
        uses: actions/upload-artifact@v7
        with:
          name: lambda
          path: lambda/*/build/lambda/*.zip

      - name: Upload SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: sbom-lambda
          path: lambda/*/build/spdx/*.spdx.json

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-reports
          path: |
            lambda/*/build/reports/
            lambda/*/build/test-results/

  cdk:
    name: CDK
    needs: java
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cdk
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: cdk/.nvmrc
          cache: npm
          cache-dependency-path: cdk/package-lock.json

      - name: Download Lambda packages
        uses: actions/download-artifact@v7
        with:
          name: lambda
          path: lambda

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run build

      - name: Lint
        run: npm run lint

      # Fails below 90% line coverage.
      - name: Test
        run: npm test

      # No AWS credentials: an environment-agnostic template.
      - name: Synthesize
        run: npx cdk synth --quiet

      - name: SBOM
        run: npm run sbom

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cdk
          path: cdk/sbom.spdx.json
